<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yeezy Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Yeezy Archive</h1>

  <!-- FILTER BAR -->
  <div class="filters">
    <select id="colorFilter">
      <option value="">All Colors</option>
      <option value="black">Black</option>
      <option value="gray">Gray</option>
      <option value="cream">Cream</option>
      <option value="white">White</option>
      <option value="olive">Olive</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="brown">Brown</option>
    </select>

    <select id="typeFilter">
      <option value="">All Types</option>
      <option value="sock">Socks</option>
      <option value="sweatpant">Sweatpants</option>
      <option value="tshirt">T-Shirts</option>
      <option value="hoodie">Hoodies</option>
      <option value="short">Shorts</option>
      <option value="windbreaker">Windbreakers</option>
      <option value="jacket">Jackets</option>
      <option value="backpack">Backpacks</option>
      <option value="sunglass">Sunglasses</option>
      <option value="hat">Hats</option>
      <option value="shoe">Shoes</option>
    </select>

    <select id="yearFilter">
      <option value="">All Years</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>

    <select id="priceSort">
      <option value="">Sort by Price</option>
      <option value="low">Low → High</option>
      <option value="high">High → Low</option>
    </select>
  </div>

  <!-- ITEMS GRID -->
  <div id="items" class="grid"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
